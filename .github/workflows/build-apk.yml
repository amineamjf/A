name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AmineHanout-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AmineHanout.apk
          cp app/build/outputs/apk/release/app-release.apk AmineHanout-small.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk AmineHanout-small.apk AmineHanout.apk --target "$GITHUB_SHA" --title "AmineHanout APK" --notes "Direct APK download. Small build: AmineHanout-small.apk. Fallback: AmineHanout.apk"
